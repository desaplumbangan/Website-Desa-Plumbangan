judul_tentang: Plumbangan
heading_sejarah: Sejarah Desa
deskripsi_sejarah: >-
  Desa Plumbangan sudah ada pada masa Pemerintahan Kerajaan Kediri di bawah Raja
  Jaya Baya, yang terus berlangsung hingga Pemerintahan Majapahit, hingga masa
  keruntuhannya. Berdasarkan data yang kami dapat bahwa Pemerintah Desa
  Plumbangan yang pertama baru dimulai Tahun 1895 Masehi.
foto_sejarah: /images/tentang/foto_sejarah.webp
jumlah_penduduk: '4.739'
detail_kependudukan:
  - 4 Dusun
  - 3 Sekolah
  - 1 Candi
visi_list:
  - >-
    MEWUJUDKAN DESA PLUMBANGAN YANG SEJAHTERA, RELIGIUS, DAMAI, BERBUDAYA,
    MANDIRI DAN MAMPU BERDAYA SAING
misi_list:
  - >-
    Peningkatan sarana dan prasarana pendidikan keagamaan (tempat ibadah) yang
    ada di Desa Plumbangan.
  - Memajukan dan menggali kesenian adat.
  - >-
    Pelayanan kepada masyarakat harus ditingkatkan sesuai tugas dan fungsinya
    masing-masing perangkat desa.
  - Pelayanan dasar gratis / tidak di pungut biaya.
  - Menuntaskan sertifikat tanah warga.
  - >-
    Pembangunan, pengembangan, dan pemeliharaan infrastruktur pertanian yang
    sesuai kewenangan desa.
  - >-
    Dana Desa dipergunakan untuk membiayai/ mendaya gunakan potensi dan
    sumberdaya Desa sehingga desa bisa menghidupi pelayanan dasarnya sendiri.
  - Mengutamakan hak asal usul dan kewenangan lokal skala desa.
  - Peningkatan kualitas dan akses terhadap pelayanan sosial dasar.
  - Pengupayaan peningkatan jaringan Internet untuk warga desa.
  - >-
    Membuat rasa tentram warga yang kondusif sehingga warga merasa aman dan
    nyaman dalam bermasyarakat.
  - Pengadaan, pembangunan, pengembangan, dan pemeliharaan transportasi.
