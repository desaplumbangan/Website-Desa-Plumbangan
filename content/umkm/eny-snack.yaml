nama: Eny Snack
pemilik: Eni Nuryati
kategori: Makanan
deskripsi: >-
  Kami menghadirkan aneka olahan dan camilan rumahan yang dibuat dari
  bahan-bahan pilihan dengan mengutamakan cita rasa dan kualitas. Mulai dari
  bolu pisang yang menggunakan pisang ambon segar, bolu tape dengan rasa manis
  yang khas, kue akar kelapa rasa wijen yang renyah dan gurih, hingga peyek
  kacang dan peyek udang (ebi) yang renyah serta lezat. Setiap produk kami
  diolah dengan penuh perhatian agar memberikan cita rasa yang nikmat dan cocok
  dinikmati bersama keluarga maupun sebagai teman bersantai
jam_operasional: Setiap Hari Call WA
lokasi: Desa Plumbangan RT 04 RW 02 Kec Doko Kab Blitar
