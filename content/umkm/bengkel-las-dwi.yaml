nama: Bengkel Las Dwi A
pemilik: Bambang Priyanto
kategori: Konstruksi Baja, Pagar, Pintu, Tralis, Kanopi, dll
deskripsi: >-
  Bengkel Dwi A Teknik menyediakan layanan pengelasan dan fabrikasi logam untuk
  berbagai kebutuhan rumah tangga, komersial, maupun industri. Kami melayani
  pembuatan, pemasangan, dan perbaikan pagar besi, kanopi, teralis, railing
  tangga, pintu besi, rangka baja, serta berbagai konstruksi logam lainnya.
  Dengan mengutamakan kualitas, ketelitian, dan ketepatan waktu, kami
  berkomitmen memberikan hasil yang kuat, rapi, dan sesuai kebutuhan pelanggan.
jam_operasional: 08.00 - 18.00
lokasi: Desa Plumbangan RT 01 RW 03 Barat Kantor Desa Plumbangan
